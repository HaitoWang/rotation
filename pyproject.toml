[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regert-gpt-outlook-register"
version = "0.2.0"
description = "Async registration service with PostgreSQL and Redis"
requires-python = ">=3.11"
dependencies = [
  "curl-cffi>=0.7.0",
  "requests>=2.31.0",
  "certifi>=2024.8.30",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.2.1",
  "SQLAlchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "redis[hiredis]>=5.2.0",
  "arq>=0.26.1",
  "alembic>=1.14.0",
]

[project.scripts]
regert-api = "app.main:run"
regert-worker = "app.worker:run"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
