name: regert-gpt-outlook-register

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}"
        NODE_BASE_IMAGE: "${NODE_BASE_IMAGE:-node:24-alpine}"
    restart: unless-stopped
    expose:
      - "8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state:/app/data
      - ./outputs:/app/outputs
    environment:
      OPENAI_SENTINEL_NODE_PATH: node
      # 0 disables the artificial QuickJS queue; subprocess timeouts still bound each action.
      OPENAI_SENTINEL_MAX_CONCURRENCY: "${OPENAI_SENTINEL_MAX_CONCURRENCY:-0}"
      AUTH_HTTP_TRACE: "0"
      AUTH_TRACE_DUMP: "0"
      WEBUI_DB_PATH: /app/data/webui.db
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      TEAM_SSO_SYNC_ENABLED: "${TEAM_SSO_SYNC_ENABLED:-0}"
      TEAM_SSO_SYNC_URL: "${TEAM_SSO_SYNC_URL:-http://host.docker.internal:8088/api/internal/free-accounts/import}"
      TEAM_SSO_SYNC_KEY: "${TEAM_SSO_SYNC_KEY:-}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-18765}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
