events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  resolver 127.0.0.11 valid=10s ipv6=off;
  # Proxy pools and bulk imports are JSON payloads. Nginx defaults to 1 MiB,
  # which rejects a large pool before FastAPI can validate it.
  client_max_body_size 32m;

  server {
    listen 80;
    server_name _;

    location /assets/ {
      set $app_upstream http://app:8765;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering on;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/api/v1/runs/[^/]+/events$ {
      set $app_upstream http://app:8765;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      add_header X-Accel-Buffering no always;
      proxy_read_timeout 1h;
    }

    # Large registered exports are already streamed by FastAPI. Keep this
    # path out of the buffered JSON proxy so chunks are forwarded once and
    # promptly instead of being accumulated/replayed by the generic /api/ route.
    location = /api/v1/exports {
      set $app_upstream http://app:8765;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no always;
    }

    location /api/ {
      set $app_upstream http://app:8765;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering on;
      proxy_read_timeout 1h;
    }

    location / {
      set $app_upstream http://app:8765;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering on;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
    }
  }
}
